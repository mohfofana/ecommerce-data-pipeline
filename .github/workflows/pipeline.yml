name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: dbt build (models + data tests)
        run: dbt build --profiles-dir .

      - name: Export marts to Parquet
        run: python scripts/export_marts.py

      - name: Upload marts
        uses: actions/upload-artifact@v4
        with:
          name: marts-parquet
          path: exports/*.parquet
          retention-days: 30
